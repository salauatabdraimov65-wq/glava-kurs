<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 668" width="760" height="668" role="img"><rect x="0" y="0" width="760" height="668" rx="14" fill="#FBFAF7"/><rect x="24" y="24" width="70" height="24" rx="6" fill="#8E44AD"/><text x="34" y="41" font-size="13" font-weight="700" fill="#fff" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">СХЕМА</text><text x="106" y="41" font-size="15" font-weight="700" fill="#1C232B" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Как находить интересующие интервалы</text><rect x="24" y="68" width="712" height="148" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="94" font-size="13" font-weight="700" fill="#9AA6B2" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ПРИЗНАКИ В ДАННЫХ</text><text x="38" y="116" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">• тип пород</text><text x="38" y="138" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">• каротаж сопротивления</text><text x="38" y="160" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">• каротаж пористости</text><text x="38" y="182" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">• нейтронный каротаж, если доступен</text><text x="38" y="204" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">• плотностный каротаж, если доступен</text><line x1="380.0" y1="220" x2="380.0" y2="242" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,238 386.0,238 380.0,248" fill="#5B6673"/><rect x="24" y="254" width="712" height="126" rx="10" fill="#FFF8E1" stroke="#F1C40F" stroke-width="1.5"/><text x="38" y="280" font-size="13" font-weight="700" fill="#F1C40F" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ПРАВИЛО АВТОРА</text><text x="38" y="302" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Для обломочных пород первичный параметр — сопротивление; для карбонатов</text><text x="38" y="324" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">— пористость. Сочетание сканирования с экспресс-интерпретацией</text><text x="38" y="346" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">нейтронного и плотностного каротажей может выявить литологию и иногда</text><text x="38" y="368" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">тип флюида.</text><line x1="380.0" y1="384" x2="380.0" y2="406" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,402 386.0,402 380.0,412" fill="#5B6673"/><rect x="24" y="418" width="712" height="82" rx="10" fill="#EAF5EE" stroke="#2E8B57" stroke-width="1.5"/><text x="38" y="444" font-size="13" font-weight="700" fill="#2E8B57" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ВЫВОД</text><text x="38" y="466" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Выделить зоны интереса для дальнейшей интерпретации, не считая первичное</text><text x="38" y="488" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">сканирование окончательным определением продуктивности или флюида.</text><rect x="24" y="512" width="712" height="82" rx="10" fill="#FBEDEC" stroke="#B03A2E" stroke-width="1.5"/><text x="38" y="538" font-size="13" font-weight="700" fill="#B03A2E" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">КОГДА ПРАВИЛО ОШИБАЕТСЯ</text><text x="38" y="560" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Глинистая зона может давать нефть или газ даже при низком сопротивлении;</text><text x="38" y="582" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">зона, похожая на глину, может быть радиоактивной продуктивной зоной.</text><text x="24" y="620" font-size="12" font-weight="400" fill="#5B6673" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Схема построена кодом из учебного слоя, не рисунок книги. По утверждениям узла, стр.</text><text x="24" y="638" font-size="12" font-weight="400" fill="#5B6673" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">126–140.</text></svg>