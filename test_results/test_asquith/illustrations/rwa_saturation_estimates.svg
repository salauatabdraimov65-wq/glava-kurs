<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" role="img"><rect x="0" y="0" width="760" height="452" rx="14" fill="#FBFAF7"/><rect x="24" y="24" width="70" height="24" rx="6" fill="#8E44AD"/><text x="34" y="41" font-size="13" font-weight="700" fill="#fff" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">СХЕМА</text><text x="106" y="41" font-size="15" font-weight="700" fill="#1C232B" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Расчёт насыщенности через Rwa</text><rect x="24" y="68" width="712" height="60" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="94" font-size="13" font-weight="700" fill="#9AA6B2" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ПРИЗНАКИ В ДАННЫХ</text><text x="38" y="116" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">• Rwa zone / Rwa minimum</text><line x1="380.0" y1="132" x2="380.0" y2="154" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,150 386.0,150 380.0,160" fill="#5B6673"/><rect x="24" y="166" width="712" height="60" rx="10" fill="#FFF8E1" stroke="#F1C40F" stroke-width="1.5"/><text x="38" y="192" font-size="13" font-weight="700" fill="#F1C40F" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ПРАВИЛО АВТОРА</text><text x="38" y="214" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Sw = √(Rwa minimum / Rwa zone), при n = 2.</text><line x1="380.0" y1="230" x2="380.0" y2="252" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,248 386.0,248 380.0,258" fill="#5B6673"/><rect x="24" y="264" width="712" height="60" rx="10" fill="#EAF5EE" stroke="#2E8B57" stroke-width="1.5"/><text x="38" y="290" font-size="13" font-weight="700" fill="#2E8B57" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ВЫВОД</text><text x="38" y="312" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Отношение 3 даёт Sw = 0,58; отношение 4 — 0,50; отношение 5 — 0,45.</text><rect x="24" y="336" width="712" height="60" rx="10" fill="#FBEDEC" stroke="#B03A2E" stroke-width="1.5"/><text x="38" y="362" font-size="13" font-weight="700" fill="#B03A2E" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">КОГДА ПРАВИЛО ОШИБАЕТСЯ</text><text x="38" y="384" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Глава не приводит примеров, когда это правило ошибается.</text><text x="24" y="422" font-size="12" font-weight="400" fill="#5B6673" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Схема построена кодом из учебного слоя, не рисунок книги. По утверждениям узла, стр. 130.</text></svg>