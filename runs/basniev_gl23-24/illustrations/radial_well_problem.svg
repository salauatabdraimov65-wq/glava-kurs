<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 518" width="760" height="518" role="img"><rect x="0" y="0" width="760" height="518" rx="14" fill="#FBFAF7"/><rect x="24" y="24" width="70" height="24" rx="6" fill="#8E44AD"/><text x="34" y="41" font-size="13" font-weight="700" fill="#fff" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">СХЕМА</text><text x="106" y="41" font-size="15" font-weight="700" fill="#1C232B" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Постановка задачи радиального притока</text><rect x="24" y="68" width="712" height="60" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="94" font-size="13" font-weight="700" fill="#9AA6B2" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ШАГ 1</text><text x="38" y="116" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Задать радиальное уравнение изменения давления.</text><line x1="380.0" y1="132" x2="380.0" y2="154" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,150 386.0,150 380.0,160" fill="#5B6673"/><rect x="24" y="166" width="712" height="60" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="192" font-size="13" font-weight="700" fill="#9AA6B2" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ШАГ 2</text><text x="38" y="214" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Задать начальное давление pк во всём пласте.</text><line x1="380.0" y1="230" x2="380.0" y2="252" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,248 386.0,248 380.0,258" fill="#5B6673"/><rect x="24" y="264" width="712" height="60" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="290" font-size="13" font-weight="700" fill="#9AA6B2" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ШАГ 3</text><text x="38" y="312" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Задать давление pк на бесконечности при t&gt;0.</text><line x1="380.0" y1="328" x2="380.0" y2="350" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,346 386.0,346 380.0,356" fill="#5B6673"/><rect x="24" y="362" width="712" height="82" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="388" font-size="13" font-weight="700" fill="#9AA6B2" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ШАГ 4</text><text x="38" y="410" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Зафиксировать постоянный дебит Q₀ и переписать условие через радиальный</text><text x="38" y="432" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">градиент давления.</text><text x="24" y="470" font-size="12" font-weight="400" fill="#5B6673" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Схема построена кодом из учебного слоя, не рисунок книги. По утверждениям узла, стр.</text><text x="24" y="488" font-size="12" font-weight="400" fill="#5B6673" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">488–489.</text></svg>