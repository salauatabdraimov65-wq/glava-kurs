<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" role="img"><rect x="0" y="0" width="760" height="344" rx="14" fill="#FBFAF7"/><rect x="24" y="24" width="70" height="24" rx="6" fill="#8E44AD"/><text x="34" y="41" font-size="13" font-weight="700" fill="#fff" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">СХЕМА</text><text x="106" y="41" font-size="15" font-weight="700" fill="#1C232B" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Когда пласт можно считать бесконечным</text><rect x="24" y="68" width="712" height="104" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="94" font-size="13" font-weight="700" fill="#9AA6B2" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ПРИЧИНА</text><text x="38" y="116" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Непосредственные расчёты показывают: при заданных значениях Fo и</text><text x="38" y="138" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">радиусов различие давлений в конечном и бесконечном пластах остаётся</text><text x="38" y="160" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">небольшим.</text><line x1="380.0" y1="176" x2="380.0" y2="198" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,194 386.0,194 380.0,204" fill="#5B6673"/><rect x="24" y="210" width="712" height="60" rx="10" fill="#EAF5EE" stroke="#2E8B57" stroke-width="1.5"/><text x="38" y="236" font-size="13" font-weight="700" fill="#2E8B57" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">СЛЕДСТВИЕ</text><text x="38" y="258" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Поэтому для этих условий применима формула бесконечного пласта.</text><text x="24" y="296" font-size="12" font-weight="400" fill="#5B6673" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Схема построена кодом из учебного слоя, не рисунок книги. По утверждениям узла, стр.</text><text x="24" y="314" font-size="12" font-weight="400" fill="#5B6673" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">492–493.</text></svg>