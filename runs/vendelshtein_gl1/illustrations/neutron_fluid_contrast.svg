<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 628" width="760" height="628" role="img"><rect x="0" y="0" width="760" height="628" rx="14" fill="#FBFAF7"/><rect x="24" y="24" width="70" height="24" rx="6" fill="#8E44AD"/><text x="34" y="41" font-size="13" font-weight="700" fill="#fff" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">СХЕМА</text><text x="106" y="41" font-size="15" font-weight="700" fill="#1C232B" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Как нейтронные методы различают флюиды</text><rect x="24" y="68" width="712" height="126" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="94" font-size="13" font-weight="700" fill="#9AA6B2" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ПРИЗНАКИ В ДАННЫХ</text><text x="38" y="116" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">• Тип нейтронного метода</text><text x="38" y="138" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">• Минерализация пластовой воды</text><text x="38" y="160" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">• Пластовое давление</text><text x="38" y="182" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">• Глинистость</text><line x1="380.0" y1="198" x2="380.0" y2="220" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,216 386.0,216 380.0,226" fill="#5B6673"/><rect x="24" y="232" width="712" height="126" rx="10" fill="#FFF8E1" stroke="#F1C40F" stroke-width="1.5"/><text x="38" y="258" font-size="13" font-weight="700" fill="#F1C40F" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ПРАВИЛО АВТОРА</text><text x="38" y="280" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Для разделения газа и воды при давлении до 150—200 кгс/см²,</text><text x="38" y="302" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">минерализации менее 50 г/л и низкой глинистости пригодны ННМ, НГМ и ИНМ;</text><text x="38" y="324" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">предпочтительны ННМ и НГМ. При росте минерализации и глинистости</text><text x="38" y="346" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">преимущество получают импульсные методы.</text><line x1="380.0" y1="362" x2="380.0" y2="384" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,380 386.0,380 380.0,390" fill="#5B6673"/><rect x="24" y="396" width="712" height="82" rx="10" fill="#EAF5EE" stroke="#2E8B57" stroke-width="1.5"/><text x="38" y="422" font-size="13" font-weight="700" fill="#2E8B57" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ВЫВОД</text><text x="38" y="444" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Метод разделения следует выбирать с учётом условий пласта и различаемых</text><text x="38" y="466" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">флюидов.</text><rect x="24" y="490" width="712" height="82" rx="10" fill="#FBEDEC" stroke="#B03A2E" stroke-width="1.5"/><text x="38" y="516" font-size="13" font-weight="700" fill="#B03A2E" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">КОГДА ПРАВИЛО ОШИБАЕТСЯ</text><text x="38" y="538" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Пресная вода с минерализацией менее 20—25 г/л при давлении свыше 400—500</text><text x="38" y="560" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">кгс/см² — исключение для разделения воды и газа.</text><text x="24" y="598" font-size="12" font-weight="400" fill="#5B6673" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Схема построена кодом из учебного слоя, не рисунок книги. По утверждениям узла, стр. 22–23.</text></svg>