<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 856" width="760" height="856" role="img"><rect x="0" y="0" width="760" height="856" rx="14" fill="#FBFAF7"/><rect x="24" y="24" width="70" height="24" rx="6" fill="#8E44AD"/><text x="34" y="41" font-size="13" font-weight="700" fill="#fff" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">СХЕМА</text><text x="106" y="41" font-size="15" font-weight="700" fill="#1C232B" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Перекрытие при работе с колонной</text><rect x="24" y="68" width="712" height="60" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="94" font-size="13" font-weight="700" fill="#9AA6B2" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ШАГ 1</text><text x="38" y="116" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Остановить подъём или спуск колонны.</text><line x1="380.0" y1="132" x2="380.0" y2="154" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,150 386.0,150 380.0,160" fill="#5B6673"/><rect x="24" y="166" width="712" height="82" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="192" font-size="13" font-weight="700" fill="#9AA6B2" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ШАГ 2</text><text x="38" y="214" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Разместить верхний замок бурильной трубы над столом ротора и подвесить</text><text x="38" y="236" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">колонну на клиньях.</text><line x1="380.0" y1="252" x2="380.0" y2="274" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,270 386.0,270 380.0,280" fill="#5B6673"/><rect x="24" y="286" width="712" height="60" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="312" font-size="13" font-weight="700" fill="#9AA6B2" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ШАГ 3</text><text x="38" y="334" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Установить на колонну открытый безопасный клапан.</text><line x1="380.0" y1="350" x2="380.0" y2="372" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,368 386.0,368 380.0,378" fill="#5B6673"/><rect x="24" y="384" width="712" height="60" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="410" font-size="13" font-weight="700" fill="#9AA6B2" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ШАГ 4</text><text x="38" y="432" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Закрыть безопасный клапан и превентор с трубными плашками.</text><line x1="380.0" y1="448" x2="380.0" y2="470" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,466 386.0,466 380.0,476" fill="#5B6673"/><rect x="24" y="482" width="712" height="60" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="508" font-size="13" font-weight="700" fill="#9AA6B2" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ШАГ 5</text><text x="38" y="530" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Приподнять квадрат над столом ротора и открыть безопасный клапан.</text><line x1="380.0" y1="546" x2="380.0" y2="568" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,564 386.0,564 380.0,574" fill="#5B6673"/><rect x="24" y="580" width="712" height="82" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="606" font-size="13" font-weight="700" fill="#9AA6B2" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ШАГ 6</text><text x="38" y="628" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Зарегистрировать давления перекрытия бурильной колонны в кольцевом</text><text x="38" y="650" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">пространстве скважины и приток раствора в амбар.</text><line x1="380.0" y1="666" x2="380.0" y2="688" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,684 386.0,684 380.0,694" fill="#5B6673"/><rect x="24" y="700" width="712" height="82" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="726" font-size="13" font-weight="700" fill="#9AA6B2" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ШАГ 7</text><text x="38" y="748" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Удалить поступившие из пласта жидкость или газ и закачать более тяжёлый</text><text x="38" y="770" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">раствор, вытесняя первоначальный.</text><text x="24" y="808" font-size="12" font-weight="400" fill="#5B6673" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Схема построена кодом из учебного слоя, не рисунок книги. По утверждениям узла, стр.</text><text x="24" y="826" font-size="12" font-weight="400" fill="#5B6673" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">315–316.</text></svg>