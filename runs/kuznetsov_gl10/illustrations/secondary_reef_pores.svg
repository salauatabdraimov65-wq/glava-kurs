<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 478" width="760" height="478" role="img"><rect x="0" y="0" width="760" height="478" rx="14" fill="#FBFAF7"/><rect x="24" y="24" width="70" height="24" rx="6" fill="#8E44AD"/><text x="34" y="41" font-size="13" font-weight="700" fill="#fff" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">СХЕМА</text><text x="106" y="41" font-size="15" font-weight="700" fill="#1C232B" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Как меняются пустоты рифа</text><rect x="24" y="68" width="712" height="82" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="94" font-size="13" font-weight="700" fill="#9AA6B2" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">ПРИЧИНА</text><text x="38" y="116" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Водоросли, цементация, организмы, детрит и выпадение карбонатов</text><text x="38" y="138" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">заполняют пустоты</text><line x1="380.0" y1="154" x2="380.0" y2="176" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,172 386.0,172 380.0,182" fill="#5B6673"/><rect x="24" y="188" width="712" height="60" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="214" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">первичная пористость уменьшается. Высокая проницаемость и активный</text><text x="38" y="236" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">водообмен способствуют растворению и выносу вещества</text><line x1="380.0" y1="252" x2="380.0" y2="274" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,270 386.0,270 380.0,280" fill="#5B6673"/><rect x="24" y="286" width="712" height="38" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/><text x="38" y="312" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">образуются каверны. Перекристаллизация и доломитизация</text><line x1="380.0" y1="328" x2="380.0" y2="350" stroke="#5B6673" stroke-width="2"/><polygon points="374.0,346 386.0,346 380.0,356" fill="#5B6673"/><rect x="24" y="362" width="712" height="60" rx="10" fill="#EAF5EE" stroke="#2E8B57" stroke-width="1.5"/><text x="38" y="388" font-size="13" font-weight="700" fill="#2E8B57" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">СЛЕДСТВИЕ</text><text x="38" y="410" font-size="16" font-weight="400" fill="#1C232B" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">возникает межкристаллическая пористость</text><text x="24" y="448" font-size="12" font-weight="400" fill="#5B6673" text-anchor="start" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">Схема построена кодом из учебного слоя, не рисунок книги. По утверждениям узла, стр. 205.</text></svg>